<style>
:root{
  --bg:#faf9f6;
  --paper:#ffffff;
  --ink:#1b1b1d;
  --ink-soft:#54545a;
  --ink-faint:#8e8e96;
  --line:#e7e5dd;
  --line-soft:#efeee8;
  --accent:#1f4ea3;
  --accent-soft:#eaf0fb;
  --code-bg:#f3f2ec;
  --disp:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 28px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:40}
.hbar{max-width:760px;margin:0 auto;padding:0 28px;height:66px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;cursor:pointer}
.logo .mark{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;background:var(--accent);padding:3px 7px;border-radius:5px;letter-spacing:.02em}
.htools{display:flex;gap:22px;font-size:14px;color:var(--ink-soft)}
.htools a{transition:color .15s}
.htools a:hover{color:var(--accent)}

/* ---- list view ---- */
.intro{padding:62px 0 36px}
.intro .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.intro h1{font-family:var(--disp);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.08;letter-spacing:-.02em;margin-bottom:20px}
.intro p{font-size:18px;color:var(--ink-soft);max-width:560px;line-height:1.6}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 30px;border-bottom:1px solid var(--line);position:sticky;top:66px;background:var(--bg);z-index:30}
.chip{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:6px 13px;border-radius:100px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.list{padding:8px 0 80px}
.post{display:block;padding:30px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .18s}
.post:hover{transform:translateX(5px)}
.post .row1{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.post .ptag{color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:5px;font-weight:500}
.post h2{font-family:var(--disp);font-weight:500;font-size:25px;line-height:1.22;letter-spacing:-.01em;margin-bottom:9px}
.post:hover h2{color:var(--accent)}
.post .venue{font-style:italic;color:var(--ink-faint);font-size:14px;margin-bottom:9px}
.post .excerpt{font-size:15.5px;color:var(--ink-soft);line-height:1.6}
.post .more{margin-top:12px;font-family:var(--mono);font-size:12.5px;color:var(--accent);display:inline-flex;gap:6px;align-items:center}

.empty{padding:70px 0;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:13px}

/* ---- article view ---- */
.article{display:none;padding:48px 0 96px;animation:fade .35s ease}
.article.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.back{font-family:var(--mono);font-size:13px;color:var(--ink-soft);display:inline-flex;gap:7px;align-items:center;margin-bottom:40px;cursor:pointer;transition:color .15s}
.back:hover{color:var(--accent)}
.art-head .row1{display:flex;gap:11px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-bottom:18px}
.art-head .ptag{color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:5px;font-weight:500}
.art-head h1{font-family:var(--disp);font-weight:500;font-size:clamp(30px,5vw,42px);line-height:1.12;letter-spacing:-.02em;margin-bottom:16px}
.art-head .venue{font-style:italic;color:var(--ink-soft);font-size:15.5px;padding-bottom:30px;border-bottom:2px solid var(--ink);margin-bottom:8px}

.prose{font-family:var(--disp);font-size:18.5px;line-height:1.78;color:#26262a;font-weight:400}
.prose h2{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin:48px 0 6px}
.prose h2 + p{margin-top:10px}
.prose h3{font-family:var(--disp);font-weight:600;font-size:23px;margin:36px 0 10px;letter-spacing:-.01em}
.prose p{margin:18px 0}
.prose ul{margin:18px 0;padding-left:24px}
.prose li{margin:9px 0}
.prose strong{font-weight:600;color:var(--ink)}
.prose em{font-style:italic}
.prose code{font-family:var(--mono);font-size:15px;background:var(--code-bg);padding:2px 6px;border-radius:4px}
.prose blockquote{border-left:3px solid var(--accent);background:var(--paper);padding:16px 22px;margin:26px 0;font-size:17px;color:var(--ink-soft);border-radius:0 8px 8px 0}
.prose .eq{font-family:var(--mono);font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin:24px 0;overflow-x:auto;text-align:center;color:var(--ink)}
.prose .fig{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin:28px 0;text-align:center}
.prose .fig .cap{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-top:10px}
.takeaways{background:var(--accent-soft);border-radius:12px;padding:24px 26px;margin:40px 0 0;font-family:var(--sans);font-size:15.5px;line-height:1.6}
.takeaways h4{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.takeaways ul{padding-left:20px;margin:0}
.takeaways li{margin:7px 0;color:var(--ink-soft)}

footer{border-top:1px solid var(--line);padding:34px 0;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.fbar{max-width:760px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:680px){
  .wrap,.hbar,.fbar{padding-left:20px;padding-right:20px}
  .htools{gap:16px}
  .filters{top:66px}

const posts = [
  {
    id:"deimv2",
    tag:"Detection",
    date:"2025.11.18",
    title:"DEIMv2 — 실시간 검출을 위한 매칭과 노이즈 설계 다시 보기",
    venue:"DEIM: DETR with Improved Matching for Fast Convergence 계열 · 리뷰",
    excerpt:"DETR 계열의 느린 수렴 문제를 매칭 관점에서 다시 접근한다. 어떤 설계가 수렴을 빠르게 하고, 실제 커스텀 데이터셋 학습에서 무엇이 함정이 되는지 정리했다.",
    body:`
<h2>한 줄 요약</h2>
<p>DEIM 계열은 <strong>DETR의 느린 수렴</strong>을 "한 GT에 충분한 양의 positive 매칭을 공급하는가"라는 문제로 재정의한다. 핵심은 모델 구조를 키우는 것이 아니라 <em>학습 신호의 밀도</em>를 끌어올리는 데 있다.</p>

<h2>배경</h2>
<p>DETR는 set prediction과 헝가리안 매칭으로 NMS 없는 깔끔한 검출 파이프라인을 만들었지만, 초기 학습에서 각 GT에 매칭되는 positive 쿼리가 극히 적어 수렴이 느리다. one-to-one 매칭이 주는 신호가 희박하기 때문이다.</p>

<h3>핵심 아이디어</h3>
<p>이 문제를 두 갈래로 공격한다.</p>
<ul>
<li><strong>Dense한 매칭 신호</strong> — 하나의 GT에 더 많은 positive를 연결해 초기 gradient를 풍부하게 만든다.</li>
<li><strong>품질을 반영한 타깃</strong> — positive를 균일하게 두지 않고 매칭 품질에 따라 가중해, 좋은 예측이 더 강한 신호를 받게 한다.</li>
</ul>

<div class="eq">L_total = λ_cls · L_cls + λ_box · L_box + λ_giou · L_giou</div>

<p>분류 손실에 품질 가중을 싣는 형태가 일반적이며, box 회귀는 L1과 GIoU의 조합으로 안정화한다.</p>

<h2>실무에서 걸린 지점</h2>
<p>논문만 보면 매끈하지만, 커스텀 데이터셋에 올릴 때 실제로 시간을 잡아먹은 것들이 있었다.</p>
<ul>
<li><code>category_id</code>의 0-based / 1-based 처리 — COCO 변환 과정에서 한 칸 어긋나면 전 클래스가 밀린다.</li>
<li>postprocessor의 <code>orig_size</code> 순서 — (h, w) vs (w, h)가 뒤집히면 박스가 전부 어긋난 채로 mAP만 낮게 나온다.</li>
<li>다중 GPU 환경에서 NCCL 초기화와 dataloader 키 충돌 — config 구조를 정리하지 않으면 조용히 한 쪽 설정이 덮인다.</li>
</ul>

<blockquote>“수렴이 느리다”는 증상은 종종 모델이 아니라 <em>매칭이 신호를 충분히 만들어내지 못한다</em>는 데이터 쪽 신호일 수 있다.</blockquote>

<h2>한계와 생각</h2>
<p>dense 매칭은 작은 객체나 밀집 장면에서 false positive를 키울 수 있어, 품질 가중과 threshold를 데이터 분포에 맞춰 조정해야 한다. 실시간 검출이 목표라면 backbone 경량화(HGNetv2 등)와 함께 보는 게 자연스럽다.</p>

<div class="takeaways">
<h4>Takeaways</h4>
<ul>
<li>수렴 속도는 구조가 아니라 매칭 신호의 밀도 문제로 볼 수 있다.</li>
<li>품질 가중 타깃이 dense 매칭의 노이즈를 억제하는 핵심 장치다.</li>
<li>커스텀 학습의 버그는 대개 인덱싱·좌표 순서·config 충돌에서 나온다.</li>
</ul>
</div>
`
  },
  {
    id:"openvla",
    tag:"VLA",
    date:"2026.01.12",
    title:"OpenVLA — 행동을 토큰으로 바꾼다는 것",
    venue:"OpenVLA: An Open-Source Vision-Language-Action Model · 리뷰",
    excerpt:"비전-언어 모델 위에 로봇 제어를 얹기 위해 연속적인 행동을 토큰화한다. 7-DOF 행동을 어떻게 이산화하고, 그 선택이 무엇을 잃고 얻는지 살펴봤다.",
    body:`
<h2>한 줄 요약</h2>
<p>OpenVLA는 사전학습된 VLM을 그대로 활용하기 위해, <strong>연속적인 로봇 행동을 토큰 시퀀스로 이산화</strong>한다. 언어 생성과 동일한 프레임으로 제어를 다루는 것이 핵심이다.</p>

<h2>왜 토큰화인가</h2>
<p>VLM은 "다음 토큰 예측"에 최적화돼 있다. 로봇 행동(7-DOF: 위치 3 + 회전 3 + 그리퍼 1)을 각 차원마다 이산 bin으로 나눠 토큰으로 바꾸면, 제어 문제가 <em>익숙한 시퀀스 생성 문제</em>로 환원된다.</p>

<div class="eq">a_t ∈ ℝ⁷  →  discretize  →  [tok₁, tok₂, …, tok₇]</div>

<h3>장점</h3>
<ul>
<li>VLM 사전학습 자산(시각·언어 정렬)을 거의 그대로 재사용한다.</li>
<li>멀티태스크·언어 조건부 제어가 프롬프트로 자연스럽게 표현된다.</li>
</ul>

<h3>비용</h3>
<ul>
<li>이산화는 <strong>정밀도를 깎는다</strong> — bin 해상도가 곧 제어 분해능의 상한이 된다.</li>
<li>연속 제어의 부드러움이 토큰 경계에서 끊긴다.</li>
</ul>

<blockquote>토큰화는 "제어를 언어처럼 다루겠다"는 강한 가정이다. 그 가정이 통하는 작업과, 정밀 조작처럼 깨지는 작업을 구분하는 게 중요하다.</blockquote>

<h2>V-JEPA 계열과의 대비</h2>
<p>OpenVLA가 행동을 <em>토큰 생성</em>으로 본다면, V-JEPA 2 같은 접근은 표현 공간에서의 예측과 MPC 기반 플래닝으로 행동을 다룬다. 전자는 VLM 생태계 재활용에, 후자는 표현 학습과 계획에 무게가 있다.</p>

<div class="takeaways">
<h4>Takeaways</h4>
<ul>
<li>행동 토큰화는 VLM을 제어에 끌어오는 가장 값싼 다리다.</li>
<li>대신 제어 정밀도가 bin 해상도에 묶인다.</li>
<li>"언어처럼 풀리는 작업"과 "정밀 조작"을 나눠 평가해야 한다.</li>
</ul>
</div>
`
  },
  {
    id:"hier-kd",
    tag:"KD",
    date:"2025.10.27",
    title:"계층적 지식 증류 — 라벨이 빠졌을 때를 가정하기",
    venue:"Hierarchical Knowledge Distillation for Classification · 정리 노트",
    excerpt:"계층 구조를 가진 분류에서, 일부 레벨의 라벨이 누락된 상황을 mask로 다루고 attention 기반으로 지식을 전달한다. 손실 설계와 일관성 제약을 정리했다.",
    body:`
<h2>문제 설정</h2>
<p>분류 라벨이 <strong>L1 → L4의 계층 구조</strong>를 가질 때, 실제 데이터에서는 일부 레벨 라벨이 비어 있는 경우가 많다. 이 누락을 무시하면 상위·하위 레벨 예측이 서로 모순되기 쉽다.</p>

<h2>접근</h2>
<ul>
<li><strong>Availability mask</strong> — 어떤 레벨의 라벨이 존재하는지 마스크로 표시하고, 손실 계산에서 누락 레벨을 자연스럽게 배제한다.</li>
<li><strong>Attention 기반 증류</strong> — Multi-head Cross Attention으로 교사의 레벨별 표현을 학생에 전달하되, L1→L4 순서로 순차 정렬한다.</li>
<li><strong>계층 일관성 손실</strong> — 하위 예측이 상위 예측과 모순되지 않도록 제약한다.</li>
</ul>

<div class="eq">L_total = α·L_cls + β·L_dist + γ·L_consist   (α=1, β=0.3, γ=0.3)</div>

<p>분류 손실이 주축이고, 증류와 일관성은 보조 신호로 약하게 건다. β, γ를 키우면 일관성은 좋아지지만 분류 정확도가 눌릴 수 있어 균형이 필요하다.</p>

<h2>검증에서 본 것</h2>
<ul>
<li>구성 요소별 ablation에서 일관성 손실이 <em>모순 예측 비율</em>을 눈에 띄게 줄였다.</li>
<li>합성 누락률(synthetic missing rate)을 올려가며 robustness를 봤을 때, mask 설계가 누락에 강했다.</li>
</ul>

<blockquote>계층 분류의 진짜 난점은 "정확도"보다 "상위·하위가 서로 말이 되는가"에 있다.</blockquote>

<div class="takeaways">
<h4>Takeaways</h4>
<ul>
<li>라벨 누락은 버리는 대신 mask로 명시적으로 다루는 게 낫다.</li>
<li>일관성 손실은 정확도가 아니라 예측의 모순을 줄인다.</li>
<li>증류·일관성 가중치는 분류를 누르지 않는 선에서 약하게.</li>
</ul>
</div>
`

</div>

/* ---------------- render list ---------------- */
const tags = ["All", ...Array.from(new Set(posts.map(p=>p.tag)))];
let activeTag = "All";

function renderFilters(){
  document.getElementById("filters").innerHTML = tags.map(t=>
    `<span class="chip ${t===activeTag?'on':''}" data-tag="${t}">${t}</span>`
  ).join("");
  document.querySelectorAll(".chip").forEach(c=>{
    c.onclick=()=>{activeTag=c.dataset.tag;renderFilters();renderList();};
  });
}
function renderList(){
  const items = posts.filter(p=>activeTag==="All"||p.tag===activeTag);
  const el = document.getElementById("list");
  if(!items.length){el.innerHTML=`<div class="empty">이 태그의 글이 아직 없습니다.</div>`;return;}
  el.innerHTML = items.map(p=>`
    <div class="post" data-id="${p.id}">
      <div class="row1"><span class="ptag">${p.tag}</span><span>${p.date}</span></div>
      <h2>${p.title}</h2>
      <div class="venue">${p.venue}</div>
      <div class="excerpt">${p.excerpt}</div>
      <span class="more">리뷰 읽기 →</span>
    </div>`).join("");
  document.querySelectorAll(".post").forEach(p=>{
    p.onclick=()=>openArticle(p.dataset.id);
  });
}

/* ---------------- article view ---------------- */
function openArticle(id){
  const p = posts.find(x=>x.id===id);
  if(!p) return;
  document.getElementById("article").innerHTML = `
    <span class="back" onclick="goHome()">← 목록으로</span>
    <div class="art-head">
      <div class="row1"><span class="ptag">${p.tag}</span><span>${p.date}</span></div>
      <h1>${p.title}</h1>
      <div class="venue">${p.venue}</div>
    </div>
    <div class="prose">${p.body}</div>`;
  document.getElementById("listview").style.display="none";
  document.getElementById("article").classList.add("show");
  location.hash = id;
  window.scrollTo({top:0});
}
function goHome(){
  document.getElementById("article").classList.remove("show");
  document.getElementById("listview").style.display="block";
  if(location.hash) history.replaceState(null,"",location.pathname);
  window.scrollTo({top:0});
}
window.addEventListener("hashchange",()=>{
  const h=location.hash.replace("#","");
  if(h && posts.find(x=>x.id===h)) openArticle(h);
  else if(!h) goHome();
});

renderFilters();
renderList();
const initial = location.hash.replace("#","");
if(initial && posts.find(x=>x.id===initial)) openArticle(initial);
</script>
